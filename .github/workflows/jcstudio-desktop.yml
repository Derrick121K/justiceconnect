name: JCStudio Windows installer

on:
  push:
    branches: [feature/connected-legal-suite]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: jcstudio-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Build JCStudio Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install pinned desktop build dependencies
        working-directory: desktop
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build NSIS installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Upload unsigned development installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JCStudio-Windows-x64-unsigned
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
