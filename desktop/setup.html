<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'none'; img-src 'self' data:">
  <meta name="theme-color" content="#0b1728">
  <title>Connect JCStudio</title>
  <link rel="stylesheet" href="setup.css">
</head>
<body>
  <main class="setup-card">
    <div class="brand-mark" aria-hidden="true">§</div>
    <small>JMSE KAPA HOLDINGS (PTY) LTD</small>
    <h1>Connect to JCStudio</h1>
    <p>Enter your organisation's official JCStudio web address. Your account will sign in through the secure hosted service.</p>
    <form id="setup-form">
      <label for="server-url">JCStudio address</label>
      <input id="server-url" name="server-url" type="url" inputmode="url" autocomplete="url" placeholder="https://studio.yourdomain.co.za" required>
      <p class="hint">Use the HTTPS address provided by your system administrator. HTTP is accepted only for localhost development.</p>
      <button id="connect-button" type="submit">Connect securely</button>
    </form>
    <p id="setup-status" role="status" aria-live="polite"></p>
  </main>
  <script src="setup.js"></script>
</body>
</html>
